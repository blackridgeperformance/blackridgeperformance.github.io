<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog - Blackridge Performance</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #0a0a0a;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
  overflow-x: hidden;
  line-height: 1.6;
}

/* NAVBAR */
nav {
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(15px);
  padding: 25px 50px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-logo {
  font-size: 20px;
  font-weight: 700;
  color: #c41e3a;
  letter-spacing: 3px;
  text-decoration: none;
}

.menu-toggle {
  width: 30px;
  height: 25px;
  position: relative;
  cursor: pointer;
  z-index: 101;
}

.menu-toggle span {
  position: absolute;
  width: 100%;
  height: 2px;
  background: #fff;
  transition: all 0.3s ease;
}

.menu-toggle span:nth-child(1) {
  top: 0;
}

.menu-toggle span:nth-child(2) {
  top: 50%;
  transform: translateY(-50%);
}

.menu-toggle span:nth-child(3) {
  bottom: 0;
}

.menu-toggle.active span:nth-child(1) {
  transform: rotate(45deg);
  top: 50%;
}

.menu-toggle.active span:nth-child(2) {
  opacity: 0;
}

.menu-toggle.active span:nth-child(3) {
  transform: rotate(-45deg);
  bottom: 50%;
}

/* SIDEBAR */
.sidebar {
  position: fixed;
  top: 0;
  right: -350px;
  width: 350px;
  height: 100vh;
  background: rgba(10, 10, 10, 0.98);
  backdrop-filter: blur(20px);
  border-left: 1px solid rgba(196, 30, 58, 0.3);
  z-index: 99;
  transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
}

.sidebar.active {
  right: 0;
}

.sidebar-content {
  padding: 100px 40px 40px;
}

.sidebar-section {
  margin-bottom: 50px;
}

.sidebar-section h3 {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.4);
  letter-spacing: 3px;
  margin-bottom: 20px;
  text-transform: uppercase;
  font-weight: 400;
}

.sidebar a {
  display: block;
  color: #fff;
  text-decoration: none;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 20px;
  transition: all 0.3s ease;
  text-transform: uppercase;
}

.sidebar a:hover {
  color: #c41e3a;
  transform: translateX(10px);
}

/* OVERLAY */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.8);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
  z-index: 98;
}

.overlay.active {
  opacity: 1;
  pointer-events: all;
}

/* STARFIELD */
.stars {
  position: fixed;
  width: 100%;
  height: 100%;
  z-index: -1;
}

.star {
  position: absolute;
  background: #fff;
  border-radius: 50%;
  animation: twinkle infinite alternate ease-in-out;
}

@keyframes twinkle {
  from { opacity: 0.2; }
  to { opacity: 0.9; }
}

/* PAGE HEADER */
.page-header {
  padding: 120px 40px 80px;
  text-align: center;
}

.page-header h1 {
  font-size: clamp(48px, 8vw, 80px);
  font-weight: 900;
  color: #c41e3a;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 20px;
}

.page-header p {
  font-size: 18px;
  color: rgba(255, 255, 255, 0.6);
  letter-spacing: 2px;
}

/* BLOG CONTAINER */
.blog-container {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 40px 100px;
}

/* BLOG POST CARD */
.blog-post {
  margin-bottom: 40px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.02);
  cursor: pointer;
  transition: all 0.3s ease;
  overflow: hidden;
}

.blog-post:hover {
  border-color: rgba(196, 30, 58, 0.3);
  background: rgba(196, 30, 58, 0.05);
}

.post-header {
  padding: 30px 35px;
}

.post-date {
  font-size: 12px;
  color: #c41e3a;
  letter-spacing: 2px;
  margin-bottom: 15px;
  font-weight: 700;
}

.blog-post h2 {
  font-size: clamp(24px, 3vw, 30px);
  font-weight: 700;
  color: #fff;
  margin-bottom: 15px;
  letter-spacing: 1px;
  transition: color 0.3s ease;
}

.blog-post:hover h2 {
  color: #c41e3a;
}

.post-preview {
  font-size: 16px;
  color: rgba(255, 255, 255, 0.6);
  line-height: 1.6;
}

.post-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  padding: 0 35px;
}

.post-content.expanded {
  max-height: 3000px;
  padding: 0 35px 35px;
}

.post-full-text {
  font-size: 16px;
  color: rgba(255, 255, 255, 0.7);
  line-height: 1.8;
  white-space: pre-line;
  padding-top: 20px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
}

.read-more-indicator {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px;
  color: rgba(255, 255, 255, 0.4);
  font-size: 12px;
  letter-spacing: 2px;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
  transition: all 0.3s ease;
}

.blog-post:hover .read-more-indicator {
  color: #c41e3a;
}

.read-more-indicator::after {
  content: '▼';
  margin-left: 10px;
  transition: transform 0.3s ease;
}

.blog-post.expanded .read-more-indicator::after {
  transform: rotate(180deg);
}

.loading-message {
  text-align: center;
  padding: 60px 20px;
  color: rgba(255, 255, 255, 0.5);
  font-size: 16px;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 50px 20px;
  color: rgba(255, 255, 255, 0.3);
  font-size: 13px;
  letter-spacing: 2px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}

/* RESPONSIVE */
@media (max-width: 768px) {
  nav {
    padding: 20px 25px;
  }
  
  .sidebar {
    width: 100%;
    right: -100%;
  }
  
  .sidebar-content {
    padding: 80px 30px 40px;
  }
  
  .page-header {
    padding: 100px 30px 60px;
  }
  
  .blog-container {
    padding: 0 30px 80px;
  }
}
</style>
</head>
<body>
<!-- Starfield -->
<div class="stars" id="stars"></div>

<!-- Navigation -->
<nav>
  <a href="index.html" class="nav-logo">BLACKRIDGE</a>
  <div class="menu-toggle" id="menuToggle">
    <span></span>
    <span></span>
    <span></span>
  </div>
</nav>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-content">
    <div class="sidebar-section">
      <h3>Navigate</h3>
      <a href="index.html#home">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#request">Request</a>
      <a href="index.html#updates">Updates</a>
      <a href="index.html#gallery">Gallery</a>
      <a href="blog.html">Blog</a>
    </div>
  </div>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay"></div>

<!-- Page Header -->
<div class="page-header">
  <h1>Blog</h1>
  <p>BUILD LOGS & THOUGHTS</p>
</div>

<!-- Blog Container -->
<div class="blog-container" id="blogContainer">
  <div class="loading-message">Loading posts...</div>
</div>

<!-- Footer -->
<footer>
  © 2026 Blackridge Performance
</footer>

<script>
/* SIDEBAR TOGGLE */
const menuToggle = document.getElementById('menuToggle');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

function toggleSidebar() {
  menuToggle.classList.toggle('active');
  sidebar.classList.toggle('active');
  overlay.classList.toggle('active');
  document.body.style.overflow = sidebar.classList.contains('active') ? 'hidden' : 'auto';
}

menuToggle.addEventListener('click', toggleSidebar);
overlay.addEventListener('click', toggleSidebar);

/* LOAD BLOG POSTS FROM JSON */
async function loadBlogPosts() {
  try {
    const response = await fetch('blog-posts.json');
    const posts = await response.json();
    
    const container = document.getElementById('blogContainer');
    container.innerHTML = '';
    
    posts.forEach(post => {
      const article = document.createElement('article');
      article.className = 'blog-post';
      article.setAttribute('data-id', post.id);
      
      article.innerHTML = `
        <div class="post-header">
          <div class="post-date">${post.date}</div>
          <h2>${post.title}</h2>
          <p class="post-preview">${post.preview}</p>
        </div>
        <div class="post-content">
          <div class="post-full-text">${post.content}</div>
        </div>
        <div class="read-more-indicator">READ MORE</div>
      `;
      
      // Add click handler to toggle expansion
      article.addEventListener('click', function(e) {
        // Close other posts
        document.querySelectorAll('.blog-post').forEach(otherPost => {
          if (otherPost !== article) {
            otherPost.classList.remove('expanded');
            otherPost.querySelector('.post-content').classList.remove('expanded');
            otherPost.querySelector('.read-more-indicator').textContent = 'READ MORE';
          }
        });
        
        // Toggle this post
        const content = article.querySelector('.post-content');
        const indicator = article.querySelector('.read-more-indicator');
        
        article.classList.toggle('expanded');
        content.classList.toggle('expanded');
        
        if (content.classList.contains('expanded')) {
          indicator.textContent = 'CLOSE';
        } else {
          indicator.textContent = 'READ MORE';
        }
      });
      
      container.appendChild(article);
    });
    
  } catch (error) {
    console.error('Error loading blog posts:', error);
    document.getElementById('blogContainer').innerHTML = 
      '<div class="loading-message">Failed to load posts. Make sure blog-posts.json is in the same directory.</div>';
  }
}

// Load posts when page loads
loadBlogPosts();

/* STARS */
const starsContainer = document.getElementById("stars");
for (let i = 0; i < 100; i++) {
  let star = document.createElement("div");
  star.className = "star";
  
  let size = Math.random() * 2;
  star.style.width = size + "px";
  star.style.height = size + "px";
  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";
  star.style.animationDuration = (Math.random() * 3 + 2) + "s";
  star.style.animationDelay = Math.random() * 2 + "s";
  
  starsContainer.appendChild(star);
}
</script>
</body>
</html>
