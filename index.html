<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackridge Performance</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #0a0a0a;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow-x: hidden;
}

/* NAVBAR */
nav {
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(20px);
  padding: 20px 40px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

nav a {
  color: #fff;
  margin: 0 25px;
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 1px;
  position: relative;
  transition: color 0.3s ease;
}

nav a::after {
  content: '';
  position: absolute;
  bottom: -5px;
  left: 0;
  width: 0;
  height: 2px;
  background: #00ffd5;
  transition: width 0.3s ease;
}

nav a:hover {
  color: #00ffd5;
}

nav a:hover::after {
  width: 100%;
}

/* STARFIELD */
.stars {
  position: fixed;
  width: 100%;
  height: 100%;
  z-index: -1;
}

.star {
  position: absolute;
  background: #fff;
  border-radius: 50%;
  animation: twinkle infinite alternate ease-in-out;
}

@keyframes twinkle {
  from { opacity: 0.3; }
  to { opacity: 1; }
}

/* HERO */
.hero {
  height: 85vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 40px 20px;
}

.hero h1 {
  font-size: clamp(48px, 8vw, 90px);
  font-weight: 900;
  background: linear-gradient(120deg, #fff 0%, #00ffd5 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 20px;
  letter-spacing: 2px;
  animation: fadeInUp 0.8s ease-out;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.hero p {
  font-size: clamp(16px, 2.5vw, 22px);
  color: rgba(255, 255, 255, 0.7);
  letter-spacing: 3px;
  font-weight: 300;
  animation: fadeInUp 0.8s ease-out 0.2s backwards;
}

/* GALLERY */
.gallery {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  padding: 60px 30px;
  gap: 25px;
  max-width: 1400px;
  margin: 0 auto;
}

.gallery img {
  width: 350px;
  height: 220px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  filter: brightness(0.85);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}

.gallery img:hover {
  transform: translateY(-8px) scale(1.03);
  filter: brightness(1);
  box-shadow: 
    0 12px 40px rgba(0, 0, 0, 0.4),
    0 0 0 1px rgba(0, 255, 213, 0.3);
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 999;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.96);
  backdrop-filter: blur(10px);
}

.modal.active {
  display: flex;
  justify-content: center;
  align-items: center;
  animation: fadeIn 0.25s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-content {
  position: relative;
  max-width: 90%;
  max-height: 85vh;
  padding: 20px;
}

.modal img {
  max-width: 100%;
  max-height: 80vh;
  border-radius: 4px;
  animation: modalZoom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes modalZoom {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.close {
  position: absolute;
  right: 30px;
  top: 30px;
  font-size: 40px;
  font-weight: 300;
  cursor: pointer;
  color: #fff;
  transition: all 0.3s ease;
  z-index: 1001;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.close:hover {
  color: #00ffd5;
  transform: rotate(90deg);
}

.download-btn {
  display: inline-block;
  margin-top: 25px;
  padding: 14px 35px;
  border: 1.5px solid rgba(255, 255, 255, 0.3);
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 1.5px;
  transition: all 0.3s ease;
  border-radius: 2px;
}

.download-btn:hover {
  border-color: #00ffd5;
  color: #00ffd5;
  background: rgba(0, 255, 213, 0.05);
  transform: translateY(-2px);
}

/* FOOTER */
footer {
  text-align: center;
  padding: 40px 20px;
  color: rgba(255, 255, 255, 0.3);
  font-size: 13px;
  letter-spacing: 1px;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
  margin-top: 60px;
}

/* RESPONSIVE */
@media (max-width: 768px) {
  nav {
    padding: 15px 20px;
    text-align: center;
  }
  
  nav a {
    margin: 0 15px;
    font-size: 12px;
  }
  
  .gallery {
    padding: 40px 20px;
  }
  
  .gallery img {
    width: 100%;
    max-width: 400px;
  }
  
  .close {
    right: 20px;
    top: 20px;
    font-size: 35px;
  }
}

/* SMOOTH REVEAL */
.gallery img {
  opacity: 0;
  animation: revealImage 0.6s ease-out forwards;
}

.gallery img:nth-child(1) { animation-delay: 0.1s; }
.gallery img:nth-child(2) { animation-delay: 0.2s; }
.gallery img:nth-child(3) { animation-delay: 0.3s; }
.gallery img:nth-child(4) { animation-delay: 0.4s; }

@keyframes revealImage {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>
<body>
<!-- Starfield -->
<div class="stars" id="stars"></div>

<!-- Navigation -->
<nav>
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="#gallery">Gallery</a>
</nav>

<!-- Hero -->
<div class="hero">
  <h1>BLACKRIDGE PERFORMANCE</h1>
  <p>Custom BeamNG Performance Builds</p>
</div>

<!-- Gallery -->
<div class="gallery" id="gallery"></div>

<!-- Modal -->
<div id="modal" class="modal">
  <span class="close" onclick="closeModal()">&times;</span>
  <div class="modal-content">
    <img id="modalImg" alt="Build showcase">
    <br>
    <a id="downloadBtn" class="download-btn" download>
      Download Image
    </a>
  </div>
</div>

<!-- Footer -->
<footer>
  © 2026 Blackridge Performance
</footer>

<script>
/* IMAGE LIST */
const imageFiles = [
  "23209.png",
  "car2.jpg",
  "mycustombuild.png",
  "etrackbuild.jpg"
];

const gallery = document.getElementById("gallery");

imageFiles.forEach(file => {
  let img = document.createElement("img");
  img.src = "images/" + file;
  img.alt = "Blackridge build";
  img.onclick = function() {
    openModal(img);
  };
  gallery.appendChild(img);
});

/* MODAL */
function openModal(img) {
  const modal = document.getElementById("modal");
  modal.classList.add("active");
  document.getElementById("modalImg").src = img.src;
  document.getElementById("downloadBtn").href = img.src;
  document.body.style.overflow = "hidden";
}

function closeModal() {
  const modal = document.getElementById("modal");
  modal.classList.remove("active");
  document.body.style.overflow = "auto";
}

// Close on ESC
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

// Close on background click
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

/* STARS */
const starsContainer = document.getElementById("stars");
for (let i = 0; i < 120; i++) {
  let star = document.createElement("div");
  star.className = "star";
  
  let size = Math.random() * 2.5;
  star.style.width = size + "px";
  star.style.height = size + "px";
  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";
  star.style.animationDuration = (Math.random() * 3 + 1.5) + "s";
  star.style.animationDelay = Math.random() * 2 + "s";
  
  starsContainer.appendChild(star);
}
</script>
</body>
</html>
