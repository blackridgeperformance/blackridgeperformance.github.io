<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gallery - Blackridge Performance</title>

  <style>

    body {
      background: #0a0a0a;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
    }

    nav {
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      padding: 20px;
      text-align: center;
      position: sticky;
      top: 0;
    }

    nav a {
      color: white;
      margin: 20px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    nav a:hover {
      color: red;
      text-shadow: 0 0 10px red;
    }

    h1 {
      text-align: center;
      margin-top: 30px;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 30px;
    }

    .gallery img {
      width: 320px;
      margin: 15px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.4s;
      animation: fadeInUp 0.5s ease;
    }

    .gallery img:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(255,0,0,0.6);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.95);
      text-align: center;
      padding-top: 50px;
    }

    .modal img {
      max-width: 90%;
      max-height: 80%;
      border-radius: 10px;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 35px;
      font-size: 40px;
      cursor: pointer;
    }

    .download-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      border: 2px solid red;
      color: white;
      text-decoration: none;
      transition: 0.3s;
    }

    .download-btn:hover {
      background: red;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

  </style>
</head>

<body>

<nav>
  <a href="index.html">Home</a>
  <a href="gallery.html">Gallery</a>
  <a href="about.html">About</a>
</nav>

<h1>Build Gallery</h1>

<div class="gallery" id="gallery"></div>

<div id="modal" class="modal">

  <span class="close" onclick="closeModal()">&times;</span>

  <img id="modalImg">

  <br>

  <a id="downloadBtn" class="download-btn" download>
    Download Image
  </a>

</div>

<script>

// LIST YOUR IMAGE FILES HERE
// You can use .png or .jpg

const imageFiles = [

  "car1.png",
  "car2.jpg",
  "mycustombuild.png",
  "etrackbuild.jpg"

];

// DO NOT EDIT BELOW THIS LINE

const gallery = document.getElementById("gallery");

imageFiles.forEach(file => {

  let img = document.createElement("img");

  img.src = "images/" + file;

  img.onclick = function() {

    openModal(this);

  };

  gallery.appendChild(img);

});

function openModal(img) {

  document.getElementById("modal").style.display = "block";

  document.getElementById("modalImg").src = img.src;

  document.getElementById("downloadBtn").href = img.src;

}

function closeModal() {

  document.getElementById("modal").style.display = "none";

}

window.onclick = function(event) {

  let modal = document.getElementById("modal");

  if (event.target == modal) {

    modal.style.display = "none";

  }

}

</script>

</body>
</html>
