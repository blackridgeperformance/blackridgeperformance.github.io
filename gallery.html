<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gallery - Blackridge Performance</title>

  <style>
    body {
      background: #0a0a0a;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
    }

    nav {
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      padding: 20px;
      text-align: center;
      position: sticky;
      top: 0;
    }

    nav a {
      color: white;
      margin: 20px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    nav a:hover {
      color: red;
      text-shadow: 0 0 10px red;
    }

    h1 {
      text-align: center;
      margin-top: 30px;
      animation: fadeIn 1s ease;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 30px;
    }

    .gallery img {
      width: 320px;
      margin: 15px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.4s;
    }

    .gallery img:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(255,0,0,0.6);
    }

    /* Fullscreen modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.95);
      text-align: center;
      padding-top: 50px;
    }

    .modal img {
      max-width: 90%;
      max-height: 80%;
      border-radius: 10px;
      animation: zoomIn 0.3s ease;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 35px;
      font-size: 40px;
      cursor: pointer;
      color: white;
    }

    .download-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      border: 2px solid red;
      color: white;
      text-decoration: none;
      transition: 0.3s;
    }

    .download-btn:hover {
      background: red;
      box-shadow: 0 0 15px red;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    @keyframes zoomIn {
      from {
        transform: scale(0.8);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

  </style>
</head>

<body>

<nav>
  <a href="index.html">Home</a>
  <a href="gallery.html">Gallery</a>
  <a href="about.html">About</a>
</nav>

<h1>Build Gallery</h1>

<div class="gallery">

  <img src="images/car1.jpg" onclick="openModal(this)">
  <img src="images/car2.jpg" onclick="openModal(this)">
  <img src="images/car3.jpg" onclick="openModal(this)">

</div>

<!-- Fullscreen Modal -->
<div id="modal" class="modal">

  <span class="close" onclick="closeModal()">&times;</span>

  <img id="modalImg">

  <br>

  <a id="downloadBtn" class="download-btn" download>
    Download Image
  </a>

</div>

<script>

function openModal(img) {

  document.getElementById("modal").style.display = "block";

  document.getElementById("modalImg").src = img.src;

  document.getElementById("downloadBtn").href = img.src;

}

function closeModal() {

  document.getElementById("modal").style.display = "none";

}

// Close if clicking background
window.onclick = function(event) {

  let modal = document.getElementById("modal");

  if (event.target == modal) {

    modal.style.display = "none";

  }

}

</script>

</body>
</html>
